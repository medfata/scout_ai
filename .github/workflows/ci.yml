name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://scout:scout@localhost:5432/scout_ci
      # Review item 21: DRY_RUN=true is refused without a redirect address, and these two
      # model ids are required core vars (section 4: ids live in env, never hard-coded).
      DRY_RUN: "true"
      DRY_RUN_REDIRECT_EMAIL: scout-ci@example.com
      MODEL_COPY: test/model-copy
      MODEL_RESEARCH: test-model-research
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose: pnpm/action-setup reads `packageManager` from
      # package.json, and declaring it in both places fails the job with
      # ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations
        run: pnpm db:migrate

      - name: Tests
        run: pnpm test
